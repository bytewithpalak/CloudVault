<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudVault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23fbbf24'/><text x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' text-anchor='middle'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shape y1"></div><div class="shape g1"></div><div class="shape y2"></div>

<!-- login view -->
<main id="loginView" class="login" hidden>
  <header class="brand"><b>CloudVault</b><span>Secure file storage<br>and sharing</span></header>
  <h1 class="hero">Your files,<br><span class="mark">kept private.</span></h1>
  <p class="tagline">Upload, preview, share and revoke access from one place.</p>
  <form id="authForm" class="panel" novalidate>
    <div class="row">
      <input id="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    </div>
    <div class="row gap-top">
      <button class="primary" type="submit" value="login">Log in</button>
      <button type="submit" value="signup">Sign up</button>
      <label class="check"><input type="checkbox" id="showPassword"> Show password</label>
    </div>
    <p class="hint">New here? Use a real email and a password of 8+ characters with a letter and a number.</p>
    <p id="authMessage" class="message" role="alert"></p>
  </form>
</main>

<!-- app view -->
<div id="appView" class="app" hidden>
  <aside>
    <div class="brand"><b>CloudVault</b></div>
    <button class="primary wide" data-action="pick">⬆ Upload files</button>
    <nav id="nav">
      <button data-view="files">📁 My files</button>
      <button data-view="recent">🕘 Recent</button>
      <button data-view="starred">⭐ Starred</button>
      <button data-view="shared">👥 Shared with me</button>
      <button data-view="trash">🗑 Trash</button>
      <button data-view="activity">📋 Activity</button>
    </nav>
    <div class="storage">
      <strong>Storage</strong>
      <div id="meter" class="meter"></div>
      <div id="usageText" class="muted"></div>
      <ul id="legend" class="legend"></ul>
    </div>
  </aside>

  <section class="content">
    <div class="topbar">
      <input id="search" type="search" placeholder="Search files…" aria-label="Search files">
      <button data-action="theme" title="Light or dark mode">🌓</button>
      <button data-action="account" id="account" title="Account"></button>
      <button data-action="logout">Log out</button>
    </div>

    <div class="heading">
      <h2 id="title"></h2>
      <div id="crumbs" class="crumbs"></div>
    </div>

    <div id="toolbar" class="toolbar">
      <select id="typeFilter" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="image">Images</option>
        <option value="document">Documents</option>
        <option value="video">Videos</option>
        <option value="audio">Audio</option>
        <option value="archive">Archives</option>
        <option value="other">Other</option>
      </select>
      <select id="sort" aria-label="Sort files">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Name A–Z</option>
        <option value="size">Largest first</option>
      </select>
      <button data-action="layout" id="layoutButton"></button>
      <button data-action="newFolder" id="newFolderButton">＋ New folder</button>
      <button data-action="emptyTrash" id="emptyTrashButton" class="danger">Empty trash</button>
    </div>

    <div id="selectionBar" class="selection" hidden>
      <strong id="selectionCount"></strong>
      <button class="small" data-action="bulkStar">Star</button>
      <button class="small" data-action="bulkMove">Move</button>
      <button class="small danger" data-action="bulkTrash">Move to trash</button>
      <button class="small" data-action="clearSelection">Clear</button>
    </div>

    <div id="list"></div>
  </section>
</div>

<input id="fileInput" type="file" multiple hidden>
<div id="dropZone" class="drop" hidden><div>Drop files to upload</div></div>
<div id="uploads" class="uploads" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="dialog"></dialog>

<script src="/app.js"></script>
</body>
</html>
